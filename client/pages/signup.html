<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account — Collab3D</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .bg{position:fixed;inset:0;background-image:linear-gradient(rgba(78,205,196,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(78,205,196,.04) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
    .card{position:relative;background:#1a1f2e;border:1px solid #2d3748;border-radius:16px;padding:40px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .logo{text-align:center;margin-bottom:28px}
    .logo-icon{display:inline-flex;align-items:center;justify-content:center;width:50px;height:50px;background:linear-gradient(135deg,#4ECDC4,#45B7D1);border-radius:14px;font-size:22px;margin-bottom:10px}
    .logo h1{font-size:20px;font-weight:800;color:#fff}
    .logo p{font-size:13px;color:#718096;margin-top:4px}
    .group{margin-bottom:16px}
    label{display:block;font-size:12px;font-weight:600;color:#a0aec0;margin-bottom:6px}
    input{width:100%;padding:11px 14px;background:#0f1117;border:1px solid #2d3748;border-radius:8px;color:#e2e8f0;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
    input:focus{border-color:#4ECDC4;box-shadow:0 0 0 3px rgba(78,205,196,.15)}
    .pw-wrap{position:relative}
    .pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#718096;font-size:16px;padding:4px}
    .strength{height:3px;border-radius:2px;margin-top:6px;background:#2d3748;overflow:hidden}
    .strength-bar{height:100%;border-radius:2px;transition:width .3s,background .3s;width:0}
    .btn{display:block;width:100%;padding:12px;background:linear-gradient(135deg,#4ECDC4,#45B7D1);border:none;border-radius:8px;color:#0f1117;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;margin-top:4px}
    .btn:hover{opacity:.88}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .alert{padding:11px 14px;border-radius:7px;font-size:13px;margin-bottom:16px;display:none}
    .alert.error{background:rgba(252,129,129,.1);border:1px solid rgba(252,129,129,.3);color:#fc8181}
    .alert.success{background:rgba(78,205,196,.1);border:1px solid rgba(78,205,196,.3);color:#4ECDC4}
    .alert.show{display:block}
    .bottom{text-align:center;font-size:13px;color:#718096;margin-top:18px}
    .bottom a{color:#4ECDC4;text-decoration:none;font-weight:600}
    .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.2);border-top-color:#0f1117;border-radius:50%;animation:spin .6s linear infinite;margin-right:7px;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🎨</div>
    <h1>Collab3D</h1>
    <p>Create your free account</p>
  </div>

  <div class="alert" id="alert"></div>

  <div class="group">
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="yourname" autocomplete="username"/>
  </div>
  <div class="group">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
  </div>
  <div class="group">
    <label for="password">Password</label>
    <div class="pw-wrap">
      <input type="password" id="password" placeholder="Min 8 characters" autocomplete="new-password"/>
      <button type="button" class="pw-toggle" id="pwToggle">👁</button>
    </div>
    <div class="strength"><div class="strength-bar" id="strengthBar"></div></div>
  </div>

  <button class="btn" id="submitBtn">Create Account</button>

  <div class="bottom">Already have an account? <a href="login.html">Sign in</a></div>
</div>

<script>
  const API = `${location.protocol}//${location.hostname}:8080/api`;

  document.getElementById('pwToggle').addEventListener('click', () => {
    const inp = document.getElementById('password');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  });

  document.getElementById('password').addEventListener('input', (e) => {
    const pw  = e.target.value;
    const bar = document.getElementById('strengthBar');
    const score = [pw.length >= 8, /[A-Z]/.test(pw), /[0-9]/.test(pw), /[^A-Za-z0-9]/.test(pw)].filter(Boolean).length;
    const colors = ['#fc8181','#F6AD55','#68D391','#4ECDC4'];
    bar.style.width    = (score * 25) + '%';
    bar.style.background = colors[score - 1] || '#2d3748';
  });

  function showAlert(msg, type = 'error') {
    const el = document.getElementById('alert');
    el.textContent = msg;
    el.className = `alert ${type} show`;
  }

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const username = document.getElementById('username').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('submitBtn');

    if (!username || !email || !password) { showAlert('All fields are required.'); return; }
    if (password.length < 8) { showAlert('Password must be at least 8 characters.'); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>Creating account…';

    try {
      const res  = await fetch(`${API}/auth/register`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Registration failed');

      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));

      showAlert(`Welcome, @${data.user.username}! 🎉`, 'success');
      setTimeout(() => {
        location.href = new URLSearchParams(location.search).get('redirect') || '/index.html';
      }, 1000);
    } catch (err) {
      showAlert(err.message);
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  });

  if (localStorage.getItem('token')) {
    location.href = new URLSearchParams(location.search).get('redirect') || '/index.html';
  }
</script>
</body>
</html>
