<body>
  <div class="bg-grid"></div>

  <div class="card">
    <div class="logo">
      <div class="logo-icon">🎨</div>
      <h1>Collab3D</h1>
      <p>Sign in to your account</p>
    </div>

    <div id="alert" class="alert"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
          <button type="button" class="toggle-pw" id="togglePw">👁</button>
        </div>
      </div>

      <div class="forgot"><a href="forgot-password.html">Forgot password?</a></div>

      <button type="submit" class="btn" id="submitBtn">Sign In</button>
    </form>

    <div class="link-row">
      Don't have an account? <a href="signup.html">Create one</a>
    </div>
  </div>

  <script>
    const API = window.API_URL || `${location.protocol}//${location.hostname}:8080/api`;

    document.getElementById('togglePw').addEventListener('click', () => {
      const inp = document.getElementById('password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    });

    function showAlert(msg, type = 'error') {
      const el = document.getElementById('alert');
      el.textContent = msg;
      el.className = `alert ${type}`;
      el.style.display = 'block';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('submitBtn');

      if (!email || !password) { showAlert('Please enter your email and password.'); return; }
      if (password.length < 8) { showAlert('Password must be at least 8 characters.'); return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Signing in…';

      const redirect = new URLSearchParams(location.search).get('redirect') || '/index.html';

      try {
        // 1. Try to log in first
        const loginRes  = await fetch(`${API}/auth/login`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const loginData = await loginRes.json();

        if (loginRes.ok) {
          // ✅ Existing account — logged in
          localStorage.setItem('token', loginData.token);
          localStorage.setItem('user',  JSON.stringify(loginData.user));
          location.href = redirect;
          return;
        }

        // 2. If "Invalid credentials" it may just mean no account yet — auto-register
        if (loginData.error === 'Invalid credentials') {
          btn.innerHTML = '<span class="spinner"></span>Creating account…';

          // Derive a username from the email (e.g. "jane" from "jane@example.com")
          const username = email.split('@')[0].replace(/[^a-zA-Z0-9_]/g, '').slice(0, 20) || 'user' + Date.now();

          const regRes  = await fetch(`${API}/auth/register`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password })
          });
          const regData = await regRes.json();

          if (regRes.ok) {
            // ✅ New account created and logged in
            localStorage.setItem('token', regData.token);
            localStorage.setItem('user',  JSON.stringify(regData.user));
            showAlert(`Welcome! Account created as @${regData.user.username} 🎉`, 'success');
            setTimeout(() => { location.href = redirect; }, 1200);
          } else if (regData.error?.includes('email') && regData.error?.includes('taken')) {
            // Email exists but wrong password
            showAlert('Wrong password. Please try again.');
            btn.disabled = false; btn.textContent = 'Sign In';
          } else {
            throw new Error(regData.error || 'Registration failed');
          }
        } else {
          throw new Error(loginData.error || 'Sign in failed');
        }
      } catch (err) {
        showAlert(err.message);
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });

    // Redirect if already logged in
    if (localStorage.getItem('token')) {
      location.href = '/';
    }
  </script>
