<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collab3D — Collaborative 3D Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; background: #1a1a2e; color: #fff; }

    #canvas-container { width: 100vw; height: 100vh; position: relative; }

    /* Top bar */
    #topbar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 200;
      height: 50px; background: rgba(15,17,23,.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid #2d3748;
      display: flex; align-items: center; padding: 0 16px; gap: 10px;
    }
    #topbar .logo { font-size: 16px; font-weight: 800; color: #4ECDC4; margin-right: 4px; }
    #topbar .spacer { flex: 1; }
    .top-btn {
      padding: 6px 14px; border-radius: 7px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; transition: opacity .15s; white-space: nowrap;
    }
    .top-btn.ghost  { background: rgba(255,255,255,.07); color: #a0aec0; }
    .top-btn.ghost:hover { background: rgba(255,255,255,.13); color: #fff; }
    .top-btn.teal   { background: linear-gradient(135deg,#4ECDC4,#45B7D1); color: #0f1117; }
    .top-divider    { width: 1px; height: 24px; background: #2d3748; }

    /* Side panel */
    #controls {
      position: absolute; top: 66px; left: 16px;
      background: rgba(26,31,46,.92); backdrop-filter: blur(10px);
      padding: 16px; border-radius: 10px; border: 1px solid #2d3748;
      min-width: 210px; z-index: 100;
    }
    .btn-group { display: flex; gap: 7px; margin-bottom: 10px; flex-wrap: wrap; }
    button {
      padding: 8px 13px; background: #4ECDC4; border: none; border-radius: 6px;
      color: #1a1a2e; font-weight: 600; cursor: pointer; font-size: 13px;
      transition: opacity .15s, transform .1s;
    }
    button:hover   { opacity: .88; }
    button:active  { transform: scale(.97); }
    button.ghost   { background: rgba(255,255,255,.08); color: #a0aec0; }
    button.danger  { background: rgba(252,129,129,.15); color: #fc8181; border: 1px solid rgba(252,129,129,.25); }

    #status {
      margin-top: 10px; padding: 7px 11px;
      background: rgba(78,205,196,.08); border-radius: 6px;
      font-size: 12px; border-left: 3px solid #4ECDC4;
    }
    #status.disconnected { border-left-color: #fc8181; background: rgba(252,129,129,.08); color: #fc8181; }

    #users { margin-top: 10px; }
    #users h3 { font-size: 11px; color: #718096; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .05em; }
    .user-item { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; font-size: 12px; }
    .user-dot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    #selected-info { margin-top: 10px; padding: 9px; background: rgba(255,255,255,.04); border-radius: 6px; font-size: 12px; display: none; }
    #selected-info h3 { font-size: 12px; margin-bottom: 6px; color: #4ECDC4; }
    .info-row { display: flex; justify-content: space-between; margin-bottom: 3px; }
    .info-label { color: #718096; }

    .helper { margin-top: 10px; padding: 8px 10px; background: rgba(255,255,255,.03); border-radius: 6px; font-size: 11px; color: #718096; line-height: 1.7; }

    /* Cursors */
    .cursor { position: absolute; width: 14px; height: 14px; border-radius: 50%; pointer-events: none; z-index: 99; border: 2px solid #fff; transform: translate(-50%,-50%); }
    .cursor-label { position: absolute; top: 18px; left: 0; background: rgba(0,0,0,.7); padding: 2px 6px; border-radius: 4px; font-size: 10px; white-space: nowrap; }

    /* Export dropdown */
    .dropdown { position: relative; display: inline-block; }
    .dropdown-menu { display: none; position: absolute; top: calc(100% + 6px); left: 0; background: #1a1f2e; border: 1px solid #2d3748; border-radius: 8px; min-width: 140px; z-index: 9999; overflow: hidden; }
    .dropdown:hover .dropdown-menu { display: block; }
    .dropdown-menu button { display: block; width: 100%; text-align: left; padding: 9px 14px; background: none; color: #a0aec0; border-radius: 0; font-weight: 500; }
    .dropdown-menu button:hover { background: rgba(78,205,196,.1); color: #4ECDC4; transform: none; }
  </style>
</head>
<body>
<div id="canvas-container"></div>

<!-- Top Bar -->
<div id="topbar">
  <span class="logo">🎨 Collab3D</span>
  <button class="top-btn ghost" onclick="location.href='pages/library.html'">📚 Library</button>
  <div class="top-divider"></div>
  <div class="dropdown">
    <button class="top-btn ghost">⬇ Export ▾</button>
    <div class="dropdown-menu">
      <button onclick="window.app?.exportScene('json')">JSON</button>
      <button onclick="window.app?.exportScene('gltf')">GLTF</button>
      <button onclick="window.app?.exportScene('obj')">OBJ</button>
    </div>
  </div>
  <button class="top-btn teal" onclick="window.app?.publishScene()">🚀 Publish</button>
  <div class="spacer"></div>
  <button class="top-btn ghost" id="btnHistory">⏱ History</button>
  <button class="top-btn ghost" id="btnGesture" title="Toggle hand gesture control">🖐 Gesture</button>
  <span id="topbarUser" style="font-size:13px;color:#718096">Guest</span>
  <button class="top-btn ghost" id="btnAuth" onclick="handleAuth()">Sign In</button>
</div>

<!-- Side Panel -->
<div id="controls">
  <div class="btn-group">
    <button onclick="window.app?.addCube()">＋ Cube</button>
    <button onclick="window.app?.addSphere()">＋ Sphere</button>
    <button onclick="window.app?.addCylinder()">＋ Cyl</button>
  </div>
  <div class="btn-group">
    <button class="danger" onclick="window.app?.deleteSelected()">🗑 Del</button>
    <button class="ghost"  onclick="window.app?.undo()">↩ Undo</button>
    <button class="ghost"  onclick="window.app?.redo()">↪ Redo</button>
  </div>
  <div id="status" class="disconnected">Connecting…</div>
  <div id="users"><h3>Users</h3><div id="user-list"></div></div>
  <div id="selected-info"><h3>Selected</h3><div id="selected-details"></div></div>
  <div class="helper">Click — select · Drag — move<br>Q/E — rotate · W/S — scale<br>Del — delete · Ctrl+Z — undo</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
  // ── Derive server URLs from whatever host this page was loaded from.
  // This means it works on localhost, 192.168.x.x, or any other host automatically.
  const _serverHost = window.location.hostname;
  const _serverPort = '8080';
  const _wsProto    = window.location.protocol === 'https:' ? 'wss' : 'ws';
  window.API_URL = `${window.location.protocol}//${_serverHost}:${_serverPort}/api`;
  window.WS_URL  = `${_wsProto}://${_serverHost}:${_serverPort}`;

  import './client.js';

  // Update topbar from localStorage
  function syncTopbar() {
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    document.getElementById('topbarUser').textContent = user ? user.username : 'Guest';
    document.getElementById('btnAuth').textContent    = user ? 'Sign Out' : 'Sign In';
  }
  syncTopbar();

  window.handleAuth = function() {
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    if (user) {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      syncTopbar();
    } else {
      location.href = 'pages/login.html?redirect=/index.html';
    }
  };

  document.getElementById('btnHistory')?.addEventListener('click', () => {
    window.app?.historyPanel?.toggle();
  });

  // Gesture controller — lazy-loaded on first click
  let gestureCtrl = null;
  document.getElementById('btnGesture')?.addEventListener('click', async () => {
    if (!gestureCtrl) {
      const { GestureController } = await import('./js/gestureController.js');
      gestureCtrl = new GestureController(window.app);
    }
    gestureCtrl.toggle();
    const btn = document.getElementById('btnGesture');
    btn.style.color = gestureCtrl.active ? '#4ECDC4' : '';
    btn.style.borderColor = gestureCtrl.active ? 'rgba(78,205,196,.4)' : '';
  });
</script>
</body>
</html>
